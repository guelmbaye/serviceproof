# Optional reverse proxy for a single-origin deployment.
# Browser and mobile clients only ever reach Laravel; the agent
# runtime is never exposed publicly.
server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Deliberately NOT exposed: the FastAPI agent runtime (agent:9000)
    # and any direct CAMARA / Nokia NaC egress.
}
