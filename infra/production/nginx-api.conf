# nginx inside the API container. TLS, HSTS and rate limiting live on the
# shared reverse proxy; this instance only turns HTTP into FastCGI.

user  www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 32M;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 512;

    server {
        listen 8000;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # The proxy in front sets these; trust them so Laravel sees the real
        # client and generates https:// URLs.
        real_ip_header X-Forwarded-For;
        set_real_ip_from 0.0.0.0/0;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_read_timeout 120s;
            internal;
        }

        # Nothing else in the tree is executable.
        location ~ \.php$ { return 404; }

        location ~ /\.(?!well-known) { deny all; }
    }
}
